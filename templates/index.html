<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to SignClient</title>
    <link rel="icon" type="image/png" href="https://i.imgur.com/KKsIROm.png">
    <link href="https://fonts.cdnfonts.com/css/poppins" rel="stylesheet">
                
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            gap: 32px;
        }

        .logo-container {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: white;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin-bottom: 20px;
        }

        .logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .content {
            text-align: center;
            max-width: 600px;
        }

        h1 {
            color: #2D3339;
            font-size: 32px;
            margin-bottom: 16px;
        }

        p {
            color: #4A5568;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .login-button {
            background-color: #008000;
            color: white;
            padding: 12px 24px;
            border-radius: 24px;
            text-decoration: none;
            font-weight: 500;
            transition: background-color 0.2s;
            box-shadow: 0 2px 8px rgba(0, 128, 0, 0.2);
        }

        .login-button:hover {
            background-color: #006700;
        }

        footer {
            background-color: #2D3339;
            color: white;
            padding: 24px;
            text-align: center;
            font-size: 14px;
        }

        .footer-links {
            margin-top: 16px;
        }

        .footer-links a {
            color: #FFD700;
            text-decoration: none;
            margin: 0 12px;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        /* Media Queries for Responsive Design */
        @media (max-width: 768px) {
            .logo-container {
                width: 150px;
                height: 150px;
            }

            .logo {
                width: 80%;
            }

            h1 {
                font-size: 28px;
            }

            p {
                font-size: 14px;
                margin-bottom: 16px;
            }

            .login-button {
                padding: 10px 20px;
            }

            footer {
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .logo-container {
                width: 120px;
                height: 120px;
            }

            .logo {
                width: 70%;
            }

            h1 {
                font-size: 24px;
            }

            p {
                font-size: 12px;
                margin-bottom: 12px;
            }

            .login-button {
                padding: 10px 16px;
                font-size: 14px;
            }

            footer {
                font-size: 10px;
            }
        }

    </style>
</head>
<body>

    <main>
        <div class="logo-container">
            <img src="https://centroxy.com/wp-content/uploads/2024/12/Centroxy-logo-1.png" alt="Centroxy Solution Pvt Ltd Logo" class="logo">
        </div>
        <div class="content">
            <h1>Welcome to SecureSphere</h1>
            <p>Experience secure authentication and seamless access to resources from any OIDC Identity Provider (IDP). Explore our features and benefits:</p>
            <a href="{{ url_for('wso2.login') }}" class="login-button">Click To Login</a>
        </div>
    </main>

    <footer>
        <div>© 2025 Centroxy. All Rights Reserved.</div>
        <div class="footer-links">
            <a href="#">Privacy Policy</a> |
            <a href="#">Terms of Service</a> |
            <a href="#">Contact Us</a>
        </div>
    </footer>
</body>
</html>
