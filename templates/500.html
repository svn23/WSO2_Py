<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 Internal Server Error</title>
    <link rel="icon" type="image/png" href="/templates/undefined - Imgur.png">
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(to bottom right, #1a202c, #2d3748);
            color: white;
            padding: 1rem;
        }
        .container {
            text-align: center;
            opacity: 0;
            transform: translateY(-50px);
            animation: fadeIn 0.5s forwards;
        }
        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        h1 {
            font-size: 6rem;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #63b3ed, #9f7aea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            transform: scale(0);
            animation: scaleIn 0.5s 0.2s forwards;
        }
        @keyframes scaleIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            opacity: 0;
            animation: fadeIn 0.5s 0.4s forwards;
        }
        p {
            font-size: 1.25rem;
            margin-bottom: 2rem;
            opacity: 0;
            animation: fadeIn 0.5s 0.6s forwards;
        }
        .icon {
            width: 16rem;
            height: 16rem;
            margin: 0 auto 2rem;
            position: relative;
            opacity: 0;
            animation: fadeIn 0.5s 0.8s forwards;
        }
        .icon-ring {
            position: absolute;
            inset: 0;
            border: 8px solid #f56565;
            border-radius: 50%;
            opacity: 0;
            animation: ringPulse 1.5s infinite;
        }
        @keyframes ringPulse {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }
        .icon-content {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 6rem;
            opacity: 0;
            animation: fadeIn 0.5s 2s forwards;
        }
        button {
            background-color: #f56565;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 0.25rem;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.3s;
        }
        button:hover {
            background-color: #e53e3e;
            transform: scale(1.05);
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>500</h1>
        <h2>Internal Server Error</h2>
        <p>Oops! Something went wrong on our end.</p>
        <div class="icon">
            <div class="icon-ring"></div>
            <div class="icon-ring" style="animation-delay: 0.5s;"></div>
            <div class="icon-ring" style="animation-delay: 1s;"></div>
            <div class="icon-content">⚠️</div>
        </div>
        <button onclick="window.location.reload()">Retry</button>
    </div>
</body>
</html>
