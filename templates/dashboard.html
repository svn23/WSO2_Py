<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link href="https://fonts.cdnfonts.com/css/poppins" rel="stylesheet">
    <style>
        :root {
            --primary: #007B5E; /* Teal Green */
            --primary-light: #009975; /* Bright Teal */
            --primary-dark: #00594A; /* Dark Teal */
            --background: #F3F6F5; /* Cool off-white */
            --card-bg: #FFFFFF; /* Pure White */
            --text: #1F2D38; /* Cool dark gray */
            --text-secondary: #4A5C6B; /* Blue-gray */
            --danger: #E53935; /* Bright red */
            --danger-hover: #B71C1C; /* Darker red */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .logo {
            max-width: 500px;
            margin-bottom: 20px;
        }

        .welcome-text {
            font-size: 2rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-bottom: 24px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* Subtle shadow */
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px); /* Slight lift */
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.25); /* More prominent shadow */
        }


        .card h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-details {
            display: grid;
            gap: 12px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .detail-value {
            font-size: 1rem;
            color: var(--text);
            font-weight: 500;
        }

        .json-viewer {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 16px;
            font-family: 'Monaco', monospace;
            font-size: 0.875rem;
            white-space: pre-wrap;
            margin-top: 16px;
        }

        .button {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .primary-button {
            background-color: var(--primary);
            color: white;
        }

        .primary-button:hover {
            background-color: var(--primary-light);
        }

        .danger-button {
            background-color: var(--danger);
            color: white;
            position: fixed;
            bottom: 24px;
            left: 24px;
            z-index: 1000;
        }

        .danger-button:hover {
            background-color: var(--danger-hover);
        }

        .toggle-json {
            margin-top: 16px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-slide-in {
            animation: slideIn 0.3s ease forwards;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header animate__animated animate__fadeInDown">
            <img src="https://centroxy.com/wp-content/uploads/2024/12/Centroxy-logo-1.png" alt="Company Logo" class="logo">
            <h1 class="welcome-text">Welcome, {{ given_name }}!</h1>
        </header>

        <div class="cards-container">
            <div class="card animate__animated animate__fadeInLeft">
                <h2>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    User Information
                </h2>
                <div class="user-details" id="formatted-user-info">
                    <div class="detail-item">
                        <span class="detail-label">Name</span>
                        <span class="detail-value">{{ given_name }} {{ family_name }}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Email</span>
                        <span class="detail-value">{{ email }}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Phone</span>
                        <span class="detail-value">{{ phone_number }}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Username</span>
                        <span class="detail-value">{{ username }}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Role</span>
                        <span class="detail-value">{{ roles if roles else "No roles Assigned" }}</span>
                    </div>                    
                    <div class="detail-item">
                        <span class="detail-label">U Id</span>
                        <span class="detail-value">{{ sub }}</span>
                    </div>
                </div>
            </div>

            <div class="card animate__animated animate__fadeInRight">
                <h2>
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    Raw JSON Data
                </h2>
                <pre id="json-viewer" class="json-viewer">{{ user_info | tojson(indent=2) }}</pre>
            </div>
        </div>
    </div>

    <a style= "text-decoration: none;" href="{{ url_for('wso2.logout') }}" class="button danger-button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        Logout
    </a>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        document.querySelector('.danger-button').addEventListener('click', function(e) {
            e.preventDefault();
            Swal.fire({
                title: 'Logout Confirmation',
                text: 'Are you sure you want to logout?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Yes, Logout',
                cancelButtonText: 'Cancel',
                reverseButtons: true,
                confirmButtonColor: '#dc3545',
                cancelButtonColor: '#6c757d',
                showClass: {
                    popup: 'animate__animated animate__zoomIn'
                },
                hideClass: {
                    popup: 'animate__animated animate__zoomOut'
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    window.location.href = this.href;
                }
            });
        });
    </script>
</body>
</html>
