<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>503 Service Unavailable</title>
        <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(to bottom right, #1a202c, #2d3748);
            color: white;
            padding: 1rem;
        }
        .container {
            text-align: center;
            opacity: 0;
            transform: translateY(-50px);
            animation: fadeIn 0.5s forwards;
        }
        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        h1 {
            font-size: 6rem;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #63b3ed, #9f7aea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            transform: scale(0);
            animation: scaleIn 0.5s 0.2s forwards;
        }
        @keyframes scaleIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            opacity: 0;
            animation: fadeIn 0.5s 0.4s forwards;
        }
        p {
            font-size: 1.25rem;
            margin-bottom: 2rem;
            opacity: 0;
            animation: fadeIn 0.5s 0.6s forwards;
        }
        .icon {
            width: 16rem;
            height: 16rem;
            margin: 0 auto 2rem;
            position: relative;
            opacity: 0;
            animation: fadeIn 0.5s 0.8s forwards;
        }
        .gear {
            position: absolute;
            border: 1rem solid #4299e1;
            border-radius: 50%;
        }
        .gear-outer {
            width: 12rem;
            height: 12rem;
            animation: spin 4s linear infinite;
        }
        .gear-inner {
            width: 8rem;
            height: 8rem;
            top: 2rem;
            left: 2rem;
            animation: spin 4s linear infinite reverse;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        .gear::before, .gear::after {
            content: "";
            position: absolute;
            background-color: #4299e1;
        }
        .gear::before {
            top: 50%;
            left: -2rem;
            right: -2rem;
            height: 2rem;
            transform: translateY(-50%);
        }
        .gear::after {
            left: 50%;
            top: -2rem;
            bottom: -2rem;
            width: 2rem;
            transform: translateX(-50%);
        }
        button {
            background-color: #4299e1;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 0.25rem;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.3s;
        }
        button:hover {
            background-color: #3182ce;
            transform: scale(1.05);
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>503</h1>
        <h2>Service Unavailable</h2>
        <p>The server is temporarily unable to handle the request.</p>
        <div class="icon">
            <div class="gear gear-outer"></div>
            <div class="gear gear-inner"></div>
        </div>
        <button onclick="window.location.reload()">Try Again Later</button>
    </div>
</body>
</html>
